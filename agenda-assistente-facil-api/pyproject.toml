[project]
name = "agenda-assistente-facil-api"
version = "0.1.0"
description = "Backend FastAPI para Agenda Assistente Facil"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.poetry]
name = "agenda-assistente-facil-api"
version = "0.1.0"
description = "Backend FastAPI para Agenda Assistente Facil"
readme = "README.md"
authors = ["Agenda Assistente Facil <dev@assistentefacil.online>"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115.0"
uvicorn = {version = ">=0.30.0", extras = ["standard"]}
sqlalchemy = ">=2.0.0"
alembic = ">=1.13.0"
psycopg = {version = ">=3.2.0", extras = ["binary"]}
python-jose = {version = ">=3.3.0", extras = ["cryptography"]}
passlib = {version = ">=1.7.4", extras = ["bcrypt"]}
pydantic-settings = ">=2.4.0"
httpx = ">=0.27.0"
cryptography = ">=42.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
httpx = ">=0.27.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
